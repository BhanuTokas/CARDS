name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

jobs:
  claude-review:
    # Optional: Filter by PR author
    # if: |
    #   github.event.pull_request.user.login == 'external-contributor' ||
    #   github.event.pull_request.user.login == 'new-developer' ||
    #   github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR'

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # read-only silently blocks posting the review -- the job still reports "success" (analysis completes locally), it just never submits anything
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: |
            /code-review:code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }}

            After the review above completes, always post exactly one top-level PR
            comment via `gh pr comment ${{ github.event.pull_request.number }} --repo ${{ github.repository }} --body "..."`
            summarizing the outcome, even if no issues were found. If findings were
            reported, briefly summarize them; if none were found, post a short comment
            saying so explicitly (e.g. "Automated review: no issues found."), so the PR
            always shows a visible result instead of staying silent when clean.
          # code-review normally only posts inline comments when it has findings, which
          # leaves a clean PR looking untouched -- the prompt above forces a summary
          # comment either way, so this needs Bash(gh pr comment) allowed explicitly.
          claude_args: '--allowed-tools Bash(gh pr comment:*)'
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options
