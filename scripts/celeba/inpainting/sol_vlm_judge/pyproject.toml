[project]
name = "sol-vlm-judge"
version = "0.1.0"
description = "Qwen2.5-VL yes/no judge for the CARDS inpainting ground truths (standalone; not part of the CARDS package)"
requires-python = ">=3.11,<3.13"
dependencies = [
    "torch==2.6.0",
    "torchvision==0.21.0",
    "transformers>=4.51",
    "accelerate>=0.34",
    "safetensors",
    "numpy",
    "pillow",
]

[tool.uv]
package = false

# Same CUDA 12.4 wheels the CARDS project already runs on Sol.
[tool.uv.sources]
torch = { index = "pytorch-cu124" }
torchvision = { index = "pytorch-cu124" }

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true
