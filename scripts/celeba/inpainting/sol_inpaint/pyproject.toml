[project]
name = "sol-inpaint"
version = "0.1.0"
description = "Diffusion-inpainting fills for the CARDS CelebAMask-HQ ground truth (standalone; not part of the CARDS package)"
requires-python = ">=3.11,<3.13"
dependencies = [
    "torch==2.6.0",
    "diffusers>=0.31",
    "transformers>=4.44",
    "accelerate>=0.34",
    "safetensors",
    "numpy",
    "pillow",
    "sentencepiece",
    "protobuf",
]

[tool.uv]
package = false

# Same CUDA 12.4 wheels the CARDS project already runs on Sol (PyPI's newest torch may need a newer driver).
[tool.uv.sources]
torch = { index = "pytorch-cu124" }

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true
