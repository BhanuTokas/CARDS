# notes/pcbm_correlation_investigation.md's v12 entry -- validated on
# CIFAR-100+SigLIP and found to underperform one-sided `aligned` on
# every metric. Kept as a documented experimental option, not
# recommended over `aligned`.
name: aligned_symmetric
