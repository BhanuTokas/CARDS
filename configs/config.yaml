# Top-level Hydra config. Each `defaults` entry names a config *group*
# (a subdirectory below) and which option within it is active by default.
# Override any of them from the CLI without touching this file, e.g.:
#   uv run python scripts/run_attribution.py encoder=open_clip_h retrieval=naive
# Or sweep across several at once:
#   uv run python scripts/run_attribution.py -m encoder=clip,open_clip_h,siglig
defaults:
  - encoder: clip
  - retrieval: matched
  - dataset: cifar10
  - normalization: variance
  - model: none
  - _self_

seed: 0
device: cuda

# Concept(s) to compute attribution for -- no universal default, must be set
# on the CLI, e.g. concepts='[red_wing]' or concepts='[red_wing,black_wing]'.
concepts: ???

# Step 2/3: retrieval set size — an ablation target (Section 3), not fixed.
k: 50

# Candidate pool source: "val" primary, "train" fallback if too small
# (see open design decisions checklist).
pool_source: val

# Encode-once cache for candidate pool embeddings, keyed on (dataset,
# split, encoder) -- see cards.retrieval.embedding_cache and
# notes/ablation_scope_decision.md. Persists across runs (unlike
# output_dir), since its whole purpose is to be reused by later runs/sweeps.
cache_dir: embedding_cache

# Step 5: only meaningful (and only applied) when len(concepts) > 1.
# Was `true` by default, but that setting predates orthogonalize
# actually affecting retrieval/scoring at all (previously a no-op that
# only overwrote the saved direction post-hoc, fixed in cards.pipeline --
# see build_query/orthogonalize_queries and notes/
# cub_correlation_investigation.md v57+). Early CUB ablation evidence
# (scripts/ablate_cards_cub_query_orthogonalize.py) with the fix live
# shows orthogonalizing the query before retrieval doesn't help and
# trends slightly worse than not orthogonalizing (e.g. K=50/demean=False:
# 55.0% sign agreement raw vs. 53.6% orthogonalized). Defaulting to
# false until/unless a config is found where it actually helps; still
# available as an explicit opt-in.
orthogonalize: false

# Step 1: de-mean t_c against a text-modality reference center before
# retrieval, to counteract the CLIP modality gap (see
# cards.concepts.prompts.demean_query and notes/
# pcbm_correlation_investigation.md's v8/v9 entries -- the strongest
# lever found in that investigation, e.g. r=0.163 vs. 0.120 raw on the
# CIFAR-100 validation). Default true; set demean_query=false to
# reproduce pre-de-meaning results for comparison (Section 3 ablation).
demean_query: true

# Reference concepts to compute the de-meaning text center from (needs
# a broad, stable set -- see compute_text_center's docstring for why).
# Defaults to `concepts` itself if that's >=10 entries; below that,
# falls back to CARDS' built-in generic vocabulary
# (cards.concepts.prompts.GENERIC_REFERENCE_CONCEPTS) and logs a
# warning every time, since that's a generic stand-in, not specific to
# this run's concept bank. Pass an explicit concept bank for a better
# estimate, e.g. demean_reference_concepts='[concept1,concept2,...]'.
demean_reference_concepts: null

output_dir: outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}

hydra:
  # Hydra changes the process CWD to hydra.run.dir by default, which would
  # silently break the "../Datasets/..." relative paths in configs/dataset/*.
  # Keep CWD at the launch directory instead; Hydra still writes its own
  # logs/config snapshot to output_dir regardless of this setting.
  job:
    chdir: false
  run:
    dir: ${output_dir}
  sweep:
    dir: multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.override_dirname}
