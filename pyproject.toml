[project]
name = "cards"
version = "0.1.0"
description = "CARDS: Concept Attribution via Retrieved Distribution Shift"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "torch>=2.4",
    "torchvision>=0.19",
    "open-clip-torch>=2.24",
    "numpy>=1.26",
    "scipy>=1.13",
    "scikit-learn>=1.5",
    "pillow>=10.4",
    "tqdm>=4.66",
    "hydra-core>=1.3",
    "omegaconf>=2.3",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

# CUDA build of torch/torchvision (RTX 4090, driver 596.41 -> CUDA 12.x capable).
# PyPI wheels for torch on Windows are CPU-only, so point those two packages at
# the official PyTorch CUDA index instead. Adjust the cu-tag if a different
# CUDA toolkit version is needed later.
[tool.uv.sources]
torch = { index = "pytorch-cu124" }
torchvision = { index = "pytorch-cu124" }

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cards"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
