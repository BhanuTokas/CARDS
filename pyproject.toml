[project]
name = "cards"
version = "0.1.0"
description = "CARDS: Concept Attribution via Retrieved Distribution Shift"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "torch>=2.4",
    "torchvision>=0.19",
    "open-clip-torch>=2.24",
    "numpy>=1.26",
    "scipy>=1.13",
    "scikit-learn>=1.5",
    "pillow>=10.4",
    "tqdm>=4.66",
    "hydra-core>=1.3",
    "omegaconf>=2.3",
    # open_clip's SigLIP models (configs/encoder/siglip.yaml) use an
    # HFTokenizer under the hood -- without this, encoder=siglip fails at
    # construction with "No module named 'transformers'" (found while
    # actually running it for the first time; the config existed but was
    # never exercised end to end before).
    # Pinned exactly (not just upper-bounded): confirmed directly that
    # transformers 5.15's new "heterogeneity" config-integration layer
    # breaks Florence-2's `trust_remote_code` config class
    # (AttributeError on `forced_bos_token_id`, inside AutoConfig.
    # from_pretrained, before any CARDS code runs) -- AND that 4.57.6 (the
    # newest 4.x, i.e. what a bare `<5.0` upper bound resolves to) breaks
    # it differently, via a newer attn-implementation-dispatch refactor
    # (`AttributeError: ... has no attribute '_supports_sdpa'` inside
    # Florence2ForConditionalGeneration.__init__). 4.49.0 is the one
    # version confirmed (scripts/captioning/build/
    # generate_captions_with_logprobs.py) to load Florence-2's remote code
    # cleanly AND pass the full test suite -- an exact pin, not a range,
    # since the compatible window is this narrow.
    "transformers==4.49.0",
]

[project.optional-dependencies]
# Only needed by cards.models.posthoc_cbm (Steps 6-7 black-box adapter for a
# trained github.com/mertyg/post-hoc-cbm checkpoint) -- kept optional since
# the core pipeline (Steps 1-5) never needs it.
pcbm = [
    "pytorchcv>=0.0.67",
]
# Only needed by cards.encoders.perception_encoder (Meta FAIR's Perception
# Encoder). The facebookresearch/perception_models repo itself is NOT a
# pip dependency here -- expected as a sibling checkout added to sys.path
# at runtime, not `pip install -e .`'d, since that repo's requirements.txt
# pulls in an exact-pinned numpy plus a large research/training stack this
# project doesn't need just for inference -- see
# cards.encoders.perception_encoder's docstring for the full reasoning.
# These four are the actual runtime deps of core.vision_encoder.pe/
# transforms/tokenizer, traced directly from their imports.
perception = [
    "einops>=0.8",
    "timm>=1.0",
    "ftfy>=6.0",
    "regex>=2023.0",
]
# Only needed to run github.com/mertyg/post-hoc-cbm's OWN training scripts
# (learn_concepts_dataset.py, train_pcbm.py) directly via this project's uv
# env -- distinct from the `pcbm` group above, which is for CARDS' own
# inference-time black-box adapter (cards.models.posthoc_cbm). Not used by
# any code under src/cards. pandas is the one dependency of that repo's
# training path not already covered by CARDS' own deps (torch/numpy/
# sklearn/PIL/tqdm) -- traced directly from data/concept_loaders.py's
# imports, see notes/pcbm_correlation_investigation.md's v19/Phase-1 work.
pcbm-training = [
    "pandas>=2.0",
]
# Only needed by scripts/build_imagenet_slice.py (Phase 1 of the CARDS vs.
# TCAV vs. PCBM comparison, notes/pcbm_correlation_investigation.md) to pull
# and filter a small class-targeted slice of ILSVRC/imagenet-1k from
# Hugging Face's parquet-sharded hosting -- huggingface_hub (for downloading
# individual shard files) is already a transitive dep via open_clip_torch/
# transformers; pyarrow is the one addition, needed to read/filter those
# parquet shards locally without pulling in the full `datasets` library.
imagenet = [
    "pyarrow>=17.0",
]
# Only needed by scripts/run_tcav.py (Phase 2 of the CARDS vs. TCAV vs.
# PCBM comparison, notes/pcbm_correlation_investigation.md) -- explains
# the native ImageNet backbone (cards.models.backbones.BACKBONES)
# directly via captum.concept.TCAV. Not used by any code under src/cards'
# own Steps 1-7 pipeline -- a comparison-arm dependency only.
tcav = [
    "captum>=0.7",
]
# Only needed by scripts/captioning/build/generate_captions_with_logprobs.py
# (the 5 modern-VLM half of the DBAC captioning-bias track's 13-model
# ground-truth set) -- transformers itself is already core, but the
# individual model classes need these: accelerate for device_map/
# low_cpu_mem_usage on the two 7B LLaVA variants, sentencepiece for their
# LLaMA-based tokenizer, timm + einops for Florence-2's DaViT vision
# backbone (loaded via trust_remote_code, not a direct import CARDS
# controls -- einops import requirement confirmed directly, its own
# `check_imports` refused to load without it even though nothing under
# src/cards imports it here).
captioning = [
    "accelerate>=0.30",
    "sentencepiece>=0.2",
    "timm>=1.0",
    "einops>=0.8",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

# CUDA build of torch/torchvision (RTX 4090, driver 596.41 -> CUDA 12.x capable).
# PyPI wheels for torch on Windows are CPU-only, so point those two packages at
# the official PyTorch CUDA index instead. Adjust the cu-tag if a different
# CUDA toolkit version is needed later.
[tool.uv.sources]
torch = { index = "pytorch-cu124" }
torchvision = { index = "pytorch-cu124" }

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cards"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
